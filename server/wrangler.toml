name = "cinch-standings"
main = "worker.js"
compatibility_date = "2026-11-01"

[[d1_databases]]
binding = "DB"
database_name = "cinch-standings"
database_id = "8837103f-77a5-4854-aefe-462332772813"

# No scheduled jobs: Rodeo rooms clear themselves with their own alarms.
[triggers]
crons = []

[vars]
SITE = "https://playcinch.pages.dev/"

# Cloudflare's rate limiter counts requests per address at the edge; nothing is stored by the worker.
[[ratelimits]]
name = "SIGNUP"
namespace_id = "1001"
simple = { limit = 5, period = 60 }

[[ratelimits]]
name = "LIMITS"
namespace_id = "1002"
simple = { limit = 120, period = 60 }

[[ratelimits]]
name = "SCORES"
namespace_id = "1003"
simple = { limit = 10, period = 60 }

# Rodeo rooms, one Durable Object per room code. SQLite-backed, as the free plan requires.
[[durable_objects.bindings]]
name = "RODEO"
class_name = "Rodeo"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Rodeo"]
